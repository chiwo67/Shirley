<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome, Shirley</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-wine: #3F1828;
      --color-wine-deep: #F8DDE7;
      --color-gold: #C58A64;
      --color-gold-soft: #F2DFC0;
      --color-rose: #D96E88;
      --color-ivory: #FFFDFB;
      --color-ink: #2C1820;
      --font-fraunces: "Fraunces", serif;
      --font-jost: "Jost", sans-serif;
    }
  </style>
</head>
<body class="min-h-screen overflow-hidden bg-[radial-gradient(circle_at_top,_#fffaf8_0%,_#f5dfe6_25%,_#f4d7de_58%,_#f0cbd8_100%)] font-jost text-wine">
  <main class="relative flex min-h-screen items-center justify-center px-6 py-10">
    <div class="absolute inset-0 bg-[linear-gradient(180deg,rgba(248,221,231,0.9)_0%,rgba(248,221,231,0.72)_42%,rgba(245,199,212,0.9)_100%)]"></div>

    <div class="relative z-10 max-w-xl rounded-[28px] border border-white/30 bg-[rgba(255,249,247,0.18)] p-8 text-center shadow-[0_25px_80px_-25px_rgba(63,24,40,0.7)] backdrop-blur-sm md:p-12">
      <div class="text-[0.76rem] font-medium uppercase tracking-[0.26em] text-black">A little welcome</div>
      <h1 class="mt-5 font-fraunces text-[clamp(2.5rem,6vw,4.2rem)] font-normal italic leading-[1.08] text-wine">Hi, Shirley.</h1>
      <p class="mt-5 text-[1.05rem] leading-8 text-ink/80">
        This is my little space for us — a place where I wanted to put my heart into words, memories, and one very important question.
      </p>
      <p class="mt-3 text-[1.05rem] leading-8 text-ink/80">
        Ready to start this journey with me?
      </p>

      <button id="startBtn" class="mt-8 inline-flex items-center justify-center rounded-[2px] border border-[#7a3a4d] bg-[#7a3a4d] px-8 py-3 text-[0.95rem] tracking-[0.04em] text-[#fffaf8] transition duration-300 hover:bg-[#5d2d3e] hover:text-white">
        Start
      </button>
    </div>
  </main>

  <audio id="welcomeMusic" src="assets/Daniel-Caesar-Cool-(TrendySongz.com).mp3" preload="auto" loop playsinline></audio>

  <script>
    const startBtn = document.getElementById('startBtn');
    const welcomeMusic = document.getElementById('welcomeMusic');

    const startExperience = () => {
      if (!welcomeMusic) return;

      welcomeMusic.volume = 0.9;
      welcomeMusic.currentTime = 0;
      localStorage.setItem('shirleyMusicPlaying', '1');
      welcomeMusic.play().catch(() => {});

      setTimeout(() => {
        window.location.href = 'index.html?music=1';
      }, 180);
    };

    startBtn.addEventListener('click', (event) => {
      event.preventDefault();
      startExperience();
    });
  </script>
</body>
</html>
